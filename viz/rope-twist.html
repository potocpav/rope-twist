<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rope twist on an oblique wrap</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
.wrap{padding:16px 0;} /* full width of the iframe, which spans the article's text column */
canvas{width:100%;display:block;background:#fff;border:1px solid var(--outline);border-radius:8px;}
.stage{position:relative;}
.controls{display:grid;grid-template-columns:120px minmax(0,1fr) 70px;align-items:center;gap:8px 12px;margin:14px 0;}
.controls label{font-size:14px;color:var(--muted);}
.controls output{font-size:14px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums;}
/* Pause and reset buttons, overlaid on the canvas's lower left corner; the canvas is always white, so fixed light colours. */
.overlay{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;}
.overlay button{width:40px;height:36px;border:1px solid #d6d4cc;border-radius:8px;background:rgba(255,255,255,.85);color:#1f1e1c;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.overlay button:hover{background:#f3f2ee;}
.overlay button[hidden]{display:none;}
button svg{width:16px;height:16px;fill:currentColor;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line);}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-7px;border:none;}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:none;}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.stat{background:var(--panel);border-radius:8px;padding:12px 14px;}
.stat div:first-child{font-size:13px;color:var(--muted);}
.stat div:last-child{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;}
.note{font-size:12px;line-height:1.5;color:var(--muted);margin:10px 0 0;}
</style>
</head>
<body>
<div class="wrap">
<div class="stage">
<canvas id="c" aria-label="Animated 3D rendering of a textured rope wrapped once around a horizontal grey bar; a white grid painted on the rope shows it spinning as it runs."></canvas>
<div class="overlay">
<button id="pp" aria-label="Pause"></button>
<button id="rs" aria-label="Reset" title="Reset" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7.75.75 0 1 1 1.4.5A4 4 0 1 0 8 4h-.6l1.1 1.1a.75.75 0 0 1-1 1L5.2 3.8a.75.75 0 0 1 0-1.1L7.5.5a.75.75 0 0 1 1 1L7.4 2.5z"/></svg></button>
</div>
</div>
<div class="controls">
<label for="al">Wrap angle (<i>α</i>)</label><input type="range" id="al" min="30" max="83" step="1" value="45"><output id="ao">45°</output>
<label for="sv">Pull speed</label><input type="range" id="sv" min="-10" max="10" step="1" value="5"><output id="so">5 cm/s</output>
</div>
<div class="stats">
<div class="stat"><div>Rope pulled per one full turn</div><div id="ot">18.8 cm</div></div>
<div class="stat"><div>Spin rate</div><div id="or">0.32 rev/s</div></div>
</div>
<p class="note" id="lg" hidden>This figure needs WebGL 2, which this browser does not provide.</p>
</div>
<script src="rope.js"></script>
<script>
// Braid row spacing D equals the arc width of one strand (rr·STEP), so both braid directions run at
// 45° to the rope axis and at right angles to each other: texture pixels are square on the surface.
// The 3D scene always uses the light palette on a white canvas; the controls follow the page theme.
// The rope wraps once around a bar of radius R0; the wrap angle α is measured from the bar axis, as in
// the article's helix diagram.
const R0=1,TURNS=1;
const C=Rope.THEMES.light.c,{rr,NS,cross,view}=Rope,DEG=Math.PI/180,STEP=2*Math.PI/NS,D=rr*STEP;
const cv=document.getElementById('c'),$=id=>document.getElementById(id);
const gl=cv.getContext('webgl2',{antialias:true,premultipliedAlpha:false});
if(!gl)$('lg').hidden=false;
let W,H,dpr=window.devicePixelRatio||1;
function resize(){W=cv.clientWidth;H=Math.round(W*0.55);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+cv.offsetWidth-W+'px';} // plus the border, so the drawing area stays H tall
resize();addEventListener('resize',resize);

// Shaders. Rope vertices carry (s, a): arc length along the centreline and angle around it in the
// zero-twist frame. The material angle is a - spin and the material position along the rope
// is s - pulled; the textures are mapped diagonally in these coordinates, so their rows follow the two
// helical braid directions (one strand step STEP around per row step D along).
// Shading is done in linear colour, in view space (x right, y up, z toward the viewer, orthographic,
// so the view direction is +z): a key light, a dim fill, sky/ground ambient scaled by occlusion, and a
// soft sheen. The weave's normal map is applied through a tangent frame built from screen-space
// derivatives of the position and map coordinates, so the mesh needs no tangent attributes.
const VS=`#version 300 es
in vec3 aPos;in vec3 aNrm;in vec2 aSA;
uniform mat4 uMVP;uniform mat3 uRot;
out vec3 vN,vV,vW;out vec2 vSA;
void main(){gl_Position=uMVP*vec4(aPos,1.);vN=uRot*aNrm;vV=uRot*aPos;vW=aPos;vSA=aSA;}`;
const FS=`#version 300 es
precision highp float;
in vec3 vN,vV,vW;in vec2 vSA;
uniform int uMode; // 0 textured rope, 1 plain shaded (bar)
uniform vec3 uColor,uLight,uFill;uniform sampler2D uTex,uNormal,uAO;uniform vec2 uTexScale,uMapScale;
uniform float uSpin,uPulled,uD,uStep,uR0,uRr,uSinA,uGridL;
uniform vec4 uHelix; // helix centreline: radius, z per radian, start angle, z at start
const float PI=3.14159265359,GRID_N=6.,GRID_W=.02; // grid: lines around the rope, line half-width (cm)
out vec4 o;
// Coverage of grid lines spaced period apart in x (cm), anti-aliased over a pixel.
float gridLine(float x,float period){
  float d=abs(fract(x/period+.5)-.5)*period,aa=fwidth(x)*.75;
  return 1.-smoothstep(GRID_W-aa,GRID_W+aa,d);
}
vec3 lin(vec3 c){return pow(c,vec3(2.2));}
// Perturb geometric normal N by tangent-space normal m whose x, y follow map coordinates st.
vec3 perturb(vec3 N,vec3 m,vec2 st){
  vec3 dp1=dFdx(vV),dp2=dFdy(vV);vec2 d1=dFdx(st),d2=dFdy(st);
  vec3 p2=cross(dp2,N),p1=cross(N,dp1),T=p2*d1.x+p1*d2.x,B=p2*d1.y+p1*d2.y;
  float k=inversesqrt(max(max(dot(T,T),dot(B,B)),1e-20));
  return normalize(T*k*m.x+B*k*m.y+N*m.z);
}
void main(){
  vec3 N=normalize(vN),n=N,alb;
  float ao=1.,spec,shine,grid=0.;
  if(uMode==0){
    float phi=vSA.y-uSpin,q=phi/uStep,p=(vSA.x-uPulled)/uD;
    vec2 uv=uTexScale*vec2(q-p,q+p),st=uv*uMapScale;
    alb=lin(texture(uTex,uv).rgb);
    n=perturb(N,texture(uNormal,st).xyz*2.-1.,st);
    ao=texture(uAO,st).r;
    // Contact with the bar: the rope's underside, close to the bar's surface, sees little light.
    ao*=mix(.35,1.,smoothstep(uR0,uR0+1.2*uRr,length(vW.xy)));
    spec=.06;shine=12.;
    // White grid painted on the rope, moving with it: GRID_N lines along it, and rings every uGridL cm.
    grid=max(gridLine(phi*uRr,2.*PI*uRr/GRID_N),gridLine(vSA.x-uPulled,uGridL));
  }else{
    alb=lin(uColor);
    // Contact shadow under the wrapped rope: distance from this point to the helix centreline,
    // across the rope (the helix crosses the bar's surface at the wrap angle).
    float th=uHelix.z+mod(atan(vW.y,vW.x)-uHelix.z,2.*PI),dz=vW.z-(uHelix.w+uHelix.y*(th-uHelix.z));
    float d=length(vec2(dz*uSinA,uRr));
    ao=mix(.3,1.,smoothstep(uRr,3.5*uRr,d));
    spec=.25;shine=40.;
  }
  vec3 V=vec3(0,0,1),Hk=normalize(uLight+V);
  float key=max(dot(n,uLight),0.),fill=max(dot(n,uFill),0.);
  vec3 amb=mix(vec3(.16,.15,.14),vec3(.34,.35,.37),.5+.5*n.y); // ground below, sky above
  vec3 c=alb*(amb*ao+(.95*key+.18*fill)*mix(1.,ao,.6));
  c+=spec*pow(max(dot(n,Hk),0.),shine)*ao*key*vec3(1);
  // The grid is lit by the rope's smooth shape, not the weave, so it reads as a clean overlay.
  c=mix(c,vec3(.95)*(.5+.5*max(dot(N,uLight),0.))*mix(1.,ao,.5),.9*grid);
  c+=alb*.12*pow(1.-max(dot(n,V),0.),3.)*ao; // fibre fuzz catching light at grazing angles
  o=vec4(pow(clamp(c,0.,1.),vec3(1./2.2)),1.);
}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
let prog,U={};
if(gl){prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,VS));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
for(const n of['uMVP','uRot','uMode','uColor','uLight','uFill','uTex','uTexScale','uNormal','uAO','uMapScale','uSpin','uPulled','uD','uStep','uR0','uRr','uSinA','uHelix','uGridL'])U[n]=gl.getUniformLocation(prog,n);}

// Rope textures, both repeating, with texture x along one braid direction and y along the other.
// Colour, rope-texture.png (nearest sampling): the image height spans the NS strands around the rope,
// and pixels cover equal steps along both braid directions whatever the image size. One trip around
// the rope shifts it by 1 image in y and height/width images in x, so it wraps seamlessly when the
// height is a multiple of the width.
// Weave, rope-normal.png and rope-ao.png (smooth, mipmapped; made by make-rope-maps.py): normal map
// and ambient occlusion of one 2x2-strand tile of the braid, tiled once per STRUCT x STRUCT colour
// pixels. They wrap seamlessly when the colour image height is a multiple of STRUCT.
const STRUCT=4;
// Grid ring spacing along the rope (cm): about 1 cm, chosen as a third of the colour texture's period
// along the rope (NS·D), so the rings stay continuous when the pulled offset wraps.
const GRID_L=NS*D/3;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
// Bar colour: the palette grey (C.cs), lightened halfway to white.
const barColor=()=>'#'+hex(C.cs).map(v=>Math.round((v+255)/2).toString(16).padStart(2,'0')).join('');
let tex=null,texScale=[1/NS,1/NS],normal=null,occl=null,mapScale=[1,1];
function loadTexture(url,smooth,fallback,onload){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(fallback)); // until the image loads
const set=min=>{for(const[p,v]of[[gl.TEXTURE_MIN_FILTER,min],[gl.TEXTURE_MAG_FILTER,smooth?gl.LINEAR:gl.NEAREST],[gl.TEXTURE_WRAP_S,gl.REPEAT],[gl.TEXTURE_WRAP_T,gl.REPEAT]])gl.texParameteri(gl.TEXTURE_2D,p,v);};
set(smooth?gl.LINEAR:gl.NEAREST);
const img=new Image();img.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
if(smooth){gl.generateMipmap(gl.TEXTURE_2D);set(gl.LINEAR_MIPMAP_LINEAR);}onload(img);};img.src=url;return t;}
if(gl){
gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE); // the maps are data, not colours
tex=loadTexture('rope-texture.png',false,[...hex(C.ro),255],img=>{const w=img.naturalWidth,h=img.naturalHeight;
texScale=[h/(NS*w),1/NS];mapScale=[w/STRUCT,h/STRUCT];
if(h%w)console.warn(`rope-texture.png is ${w}x${h}: height is not a multiple of width, so the texture will show a seam around the rope.`);
if(h%STRUCT)console.warn(`rope-texture.png height ${h} is not a multiple of ${STRUCT}, so the weave maps will show a seam around the rope.`);});
normal=loadTexture('rope-normal.png',true,[128,128,255,255],()=>{});
occl=loadTexture('rope-ao.png',true,[255,255,255,255],()=>{});}

// Mesh from rings of vertices. Ring: centre c, unit tangent t, frame u (b = t x u), radius r,
// normal mix (nc radial, nt along t; caps tilt the normal), arc length s. M segments around.
const M=24;
function mesh(rings){const n=rings.length,pos=[],nrm=[],sa=[],tri=[];
rings.forEach(({c,t,u,r,nc,nt,s})=>{const b=cross(t,u);for(let j=0;j<=M;j++){const a=2*Math.PI*j/M,ca=Math.cos(a),sn=Math.sin(a);
for(let k=0;k<3;k++){const rad=u[k]*ca+b[k]*sn;pos.push(c[k]+r*rad);nrm.push(rad*nc+t[k]*nt);}sa.push(s,a);}});
for(let i=0;i<n-1;i++)for(let j=0;j<M;j++){const v=i*(M+1)+j,w=v+M+1;tri.push(v,w,v+1,v+1,w,w+1);}
const vao=gl.createVertexArray();gl.bindVertexArray(vao);
[[pos,3,'aPos'],[nrm,3,'aNrm'],[sa,2,'aSA']].forEach(([d,k,name])=>{const buf=gl.createBuffer(),loc=gl.getAttribLocation(prog,name);
gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(d),gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,k,gl.FLOAT,false,0,0);});
const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(tri),gl.STATIC_DRAW);
gl.bindVertexArray(null);return{vao,ib,count:tri.length,free(){gl.deleteVertexArray(vao);}};}
// Rope tube along the wrap centreline, closed with flat end caps. Rings are placed about every
// RING cm of centreline (the physics samples are much denser than the mesh needs).
const RING=0.25;
function ropeMesh(m){const N=m.P.length,rings=[],idx=[0];
for(let i=1;i<N;i++)if(m.S[i]-m.S[idx[idx.length-1]]>=RING*0.999||i===N-1)idx.push(i);
// Cap: a disc from the centre (r = 0) to the rim, with the normal along the end tangent.
const cap=(i,sign,r)=>({c:m.P[i],t:m.Tg[i],u:m.U[i],r,nc:0,nt:sign,s:m.S[i]});
rings.push(cap(0,-1,0),cap(0,-1,rr));
for(const i of idx)rings.push({c:m.P[i],t:m.Tg[i],u:m.U[i],r:rr,nc:1,nt:0,s:m.S[i]});
rings.push(cap(N-1,1,rr),cap(N-1,1,0));
return mesh(rings);}
// Bar: cylinder of radius R0 along z, long enough to leave the view.
function barMesh(R0){const rings=[];for(let z=-40;z<=40;z+=1)rings.push({c:[0,0,z],t:[0,0,1],u:[1,0,0],r:R0,nc:1,nt:0,s:0});return mesh(rings);}

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let pulled=0,spin=0,last=performance.now(),geo=null,geoK=null,rope=null,bar=null;
const al=$('al'),sv=$('sv'),pp=$('pp');
// Steepest wrap angle before neighbouring coils touch: adjacent turns lie 2π(R0+rr)·cos α apart, measured
// perpendicular to the rope, which must be at least the rope diameter 2rr.
al.max=Math.floor(Math.acos(rr/(Math.PI*(R0+rr)))/DEG);
const ICON_PAUSE='<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a.8.8 0 0 0 1.2.7l9-5.5a.8.8 0 0 0 0-1.4l-9-5.5A.8.8 0 0 0 4 2.5z"/></svg>';
// Play/pause follows the pull speed: the animation is paused exactly when the speed is 0. Pausing
// remembers the speed and sets it to 0; playing restores it. Sliding the speed to 0 counts as a
// pause with nothing to remember, so playing then starts at the default speed.
const DEFAULT_SPEED=+sv.defaultValue;let resume=DEFAULT_SPEED;
const playing=()=>+sv.value!==0; // negative speeds pull the rope backwards
if(reduce)sv.value=0; // start paused
function setBtn(){pp.innerHTML=playing()?ICON_PAUSE:ICON_PLAY;pp.setAttribute('aria-label',playing()?'Pause':'Play');}
// Reset: sliders back to their defaults, and play. Shown only while a slider is off its default.
const rs=$('rs'),sliders=[al,sv],showReset=()=>{rs.hidden=sliders.every(r=>r.value===r.defaultValue);};
pp.onclick=()=>{if(playing()){resume=+sv.value;sv.value=0;}else{sv.value=resume;resume=DEFAULT_SPEED;}setBtn();showReset();};
sv.addEventListener('input',()=>{if(!playing())resume=DEFAULT_SPEED;setBtn();});
sliders.forEach(r=>r.addEventListener('input',showReset));
rs.onclick=()=>{sliders.forEach(r=>r.value=r.defaultValue);resume=DEFAULT_SPEED;setBtn();showReset();pp.focus();};
setBtn();showReset();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
const adeg=+al.value,a=adeg*DEG,v=+sv.value;
// buildWrap measures the wrap angle from the bar's cross-sectional plane.
if(geoK!==adeg){geo=Rope.buildWrap(Math.PI/2-a,R0,TURNS);geoK=adeg;
// Helix centreline as built by buildWrap (radius, z per radian, start angle π/2, z at start), for the bar's contact shadow.
const Rh=R0+rr,zpr=Rh/Math.tan(a);geo.alpha=a;geo.helix=[Rh,zpr,Math.PI/2,-zpr*Math.PI*TURNS];if(gl){rope&&rope.free();bar&&bar.free();rope=ropeMesh(geo);bar=barMesh(R0);}}
// Contact strip locked to bar  =>  whole rope spins at tau per length pulled.
// pulled wraps every colour-texture period, which is also a whole number of grid rings.
{const dl=v*dt;pulled=(pulled+dl)%(NS*D);spin=(spin+geo.tw*dl)%(2*Math.PI);}
const tau=Math.sin(a)*Math.cos(a)/(R0+rr);
$('ao').textContent=adeg+'°';$('so').textContent=String(v).replace('-','−')+' cm/s';
$('ot').textContent=(2*Math.PI/tau).toFixed(1)+' cm';
$('or').textContent=(v*tau/(2*Math.PI)).toFixed(2).replace('-','−')+' rev/s';
if(gl)draw(geo);requestAnimationFrame(frame);}

// Orthographic projection through view(), centred on the wrap. The view is VIEW cm wide, widened when
// a shallow wrap angle makes the helix longer, so the whole turn and some lead-in stay visible.
const VIEW=18;
function draw(m){gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
let z0=1e9,z1=-1e9;m.P.forEach(p=>{if(Math.abs(p[0])<R0+rr+0.01&&Math.abs(p[1])<R0+rr+0.01){z0=Math.min(z0,p[2]);z1=Math.max(z1,p[2]);}}); // the helix
const s=W/Math.max(VIEW,z1-z0+4*(R0+rr)),mx=(z0+z1)/2,my=0;
const R=[view([1,0,0]),view([0,1,0]),view([0,0,1])],kx=2*s/W,ky=2*s/H,kz=1/100; // R[j] = image of world axis j
const mvp=new Float32Array([...[0,1,2].flatMap(j=>[kx*R[j][0],ky*R[j][1],-kz*R[j][2],0]),-kx*mx,-ky*my,0,1]);
gl.useProgram(prog);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);
gl.uniformMatrix4fv(U.uMVP,false,mvp);gl.uniformMatrix3fv(U.uRot,false,new Float32Array(R.flat()));
const unit=v=>{const l=Math.hypot(...v);return v.map(x=>x/l);};
gl.uniform3fv(U.uLight,unit([-0.35,0.55,1]));gl.uniform3fv(U.uFill,unit([0.6,-0.3,0.5]));
gl.uniform1f(U.uSpin,spin);gl.uniform1f(U.uPulled,pulled);gl.uniform1f(U.uD,D);gl.uniform1f(U.uStep,STEP);gl.uniform1f(U.uGridL,GRID_L);
gl.uniform1f(U.uR0,R0);gl.uniform1f(U.uRr,rr);gl.uniform1f(U.uSinA,Math.sin(m.alpha));gl.uniform4fv(U.uHelix,m.helix);
gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(U.uTex,0);gl.uniform2fv(U.uTexScale,texScale);
gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,normal);gl.uniform1i(U.uNormal,1);
gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,occl);gl.uniform1i(U.uAO,2);gl.uniform2fv(U.uMapScale,mapScale);
for(const[obj,mode,col]of[[bar,1,barColor()],[rope,0,C.ro]]){gl.uniform1i(U.uMode,mode);gl.uniform3fv(U.uColor,hex(col).map(x=>x/255));
gl.bindVertexArray(obj.vao);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,obj.ib);gl.drawElements(gl.TRIANGLES,obj.count,gl.UNSIGNED_INT,0);}
gl.bindVertexArray(null);}
requestAnimationFrame(frame);
</script>
</body>
</html>
