<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rope twist on an oblique wrap</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
.wrap{max-width:560px;margin:0 auto;padding:16px;}
canvas{width:100%;display:block;}
.controls{display:grid;grid-template-columns:40px 96px minmax(0,1fr) 70px;align-items:center;gap:8px 12px;margin:14px 0;}
.controls label{font-size:14px;color:var(--muted);}
.controls output{font-size:14px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums;}
button{width:40px;height:36px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;}
button:hover{background:var(--panel);}
button svg{width:16px;height:16px;fill:currentColor;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line);}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-7px;border:none;}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:none;}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.stat{background:var(--panel);border-radius:8px;padding:12px 14px;}
.stat div:first-child{font-size:13px;color:var(--muted);}
.stat div:last-child{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;}
.note{font-size:12px;line-height:1.5;color:var(--muted);margin:10px 0 0;}
</style>
</head>
<body>
<div class="wrap">
<canvas id="c" aria-label="Animated line drawing of a braided rope pulled around a tilted cylinder; a marker line along the rope spins as the rope runs."></canvas>
<div class="controls">
<button id="pp" aria-label="Pause"></button>
<label for="al">Wrap angle</label><input type="range" id="al" min="10" max="60" step="1" value="45"><output id="ao">45°</output>
<span></span><label for="rc">Bar radius</label><input type="range" id="rc" min="0.5" max="2" step="0.1" value="1"><output id="ro">1.0 cm</output>
<span></span><label for="tn">Turns</label><input type="range" id="tn" min="0.25" max="2" step="0.05" value="1.25"><output id="to">1.25</output>
<span></span><label for="ks">Twist strain</label><input type="range" id="ks" min="-40" max="40" step="1" value="0"><output id="ko">0 °/cm</output>
<span></span><label for="sv">Pull speed</label><input type="range" id="sv" min="2" max="20" step="1" value="6"><output id="so">6 cm/s</output>
</div>
<div class="stats">
<div class="stat"><div>Rope pulled per marker turn</div><div id="ot">18.8 cm</div></div>
<div class="stat"><div>Spin rate</div><div id="or">0.32 rev/s</div></div>
</div>
<p class="note" id="lg"></p>
</div>
<script src="rope.js"></script>
<script>
const{C,rr,NS,D,add,sub,mul,dot,cross,nrm}=Rope,DEG=Math.PI/180,NI=40;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr=window.devicePixelRatio||1;
function resize(){W=cv.clientWidth;H=Math.round(Math.min(W*1.15,560));cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
resize();addEventListener('resize',resize);
let geo=null,geoK=null;
// Rope centerline: straight lead-in, helix of radius R0+r, straight lead-out (both tangent).
// Frame U: rotation-minimizing (double reflection) = zero-twist reference frame.
function build(al,R0,turns){const R=R0+rr,NH=Math.max(60,Math.round(240*turns));
const ta=Math.tan(al),phi0=0.55*Math.PI,ph1=phi0+turns*2*Math.PI,Lz=R*(ph1-phi0)*ta,zo=-Lz/2,P=[],Tg=[],Hx=[];
const hp=f=>[R*Math.cos(f),R*Math.sin(f),R*(f-phi0)*ta+zo],ht=f=>nrm([-Math.sin(f),Math.cos(f),ta]);
const t0=ht(phi0),t1=ht(ph1),p0=hp(phi0),p1=hp(ph1),Lin=4,Lout=4.5;
for(let i=NI;i>0;i--){P.push(sub(p0,mul(t0,Lin*i/NI)));Tg.push(t0);Hx.push(null);}
for(let i=0;i<=NH;i++){const f=phi0+(ph1-phi0)*i/NH;P.push(hp(f));Tg.push(ht(f));Hx.push([Math.cos(f),Math.sin(f),0]);}
for(let i=1;i<=NI;i++){P.push(add(p1,mul(t1,Lout*i/NI)));Tg.push(t1);Hx.push(null);}
const{U,S,L}=Rope.rmf(P,Tg,[Math.cos(phi0),Math.sin(phi0),0]);
// tw: measured rate (rad/cm) at which the zero-twist frame turns relative to the bar's outward normal = helix torsion (signed).
let psi=0,prev=0;for(let i=NI+1;i<=NI+NH;i++){const h=Hx[i],u=U[i],b=cross(Tg[i],u),a=Math.atan2(dot(h,b),dot(h,u));let d=a-prev;d=Math.atan2(Math.sin(d),Math.cos(d));psi+=d;prev=a;}
return{P,Tg,U,S,L,tw:psi/(S[NI+NH]-S[NI]),R0};}
const sp=90*DEG,tb=0.3,g=55*DEG;
function view(p){const c=Math.cos(sp),s=Math.sin(sp);let x=p[0]*c-p[1]*s,y=p[0]*s+p[1]*c,z=p[2];
let X=x,Y=z,Z=-y;const cb=Math.cos(tb),sb=Math.sin(tb);const Y2=Y*cb-Z*sb,Z2=Y*sb+Z*cb;
const cg=Math.cos(g),sg=Math.sin(g);return[X*cg-Y2*sg,X*sg+Y2*cg,Z2];}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let pulled=0,spin=0,playing=!reduce,last=performance.now(),kap=0;
const $=id=>document.getElementById(id),al=$('al'),rc=$('rc'),sv=$('sv'),tn=$('tn'),ks=$('ks'),pp=$('pp');
const ICON_PAUSE='<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a.8.8 0 0 0 1.2.7l9-5.5a.8.8 0 0 0 0-1.4l-9-5.5A.8.8 0 0 0 4 2.5z"/></svg>';
function setBtn(){pp.innerHTML=playing?ICON_PAUSE:ICON_PLAY;pp.setAttribute('aria-label',playing?'Pause':'Play');}
setBtn();pp.onclick=()=>{playing=!playing;setBtn();};
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
const adeg=+al.value,a=adeg*DEG,R0=+rc.value,v=+sv.value,turns=+tn.value,kdeg=+ks.value,k=adeg+'_'+R0+'_'+turns;
if(geoK!==k){geo=build(a,R0,turns);geoK=k;}
const sg=geo.tw<0?-1:1;kap=sg*kdeg*DEG;
// Contact strip locked to bar + uniform strain kappa  =>  whole rope spins at (tau - kappa) per length pulled.
if(playing){const dl=v*dt;pulled=(pulled+dl)%(NS*D);spin=(spin+(geo.tw-kap)*dl)%(2*Math.PI);}
const tau=Math.sin(a)*Math.cos(a)/(R0+rr),net=tau-kdeg*DEG;
$('ao').textContent=adeg+'°';$('ro').textContent=R0.toFixed(1)+' cm';$('so').textContent=v+' cm/s';$('to').textContent=turns.toFixed(2);$('ko').textContent=kdeg+' °/cm';
$('ot').textContent=Math.abs(net)<1e-4?'∞':(2*Math.PI/Math.abs(net)).toFixed(1)+' cm';
$('or').textContent=(v*Math.abs(net)/(2*Math.PI)).toFixed(2)+' rev/s'+(net<-1e-4?' (reversed)':'');
$('lg').textContent='Rope radius r = 0.5 cm. Violet line: marker. Bold spirals: every fifth braid strand. dk = dl·(τ − κ), where τ = sin α·cos α / (R + r) = '+Math.round(tau/DEG)+' °/cm.';
draw(geo);requestAnimationFrame(frame);}
function draw(m){ctx.clearRect(0,0,W,H);const R0=m.R0;
let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;m.P.forEach(p=>{const v=view(p);x0=Math.min(x0,v[0]);x1=Math.max(x1,v[0]);y0=Math.min(y0,v[1]);y1=Math.max(y1,v[1]);});
const pad=rr+0.5,s=Math.min(W/(x1-x0+2*pad),H/(y1-y0+2*pad)),mx=(x0+x1)/2,my=(y0+y1)/2;
const S=p=>{const v=view(p);return[W/2+(v[0]-mx)*s,H/2-(v[1]-my)*s];};
const vw=[view([1,0,0])[2],view([0,1,0])[2],view([0,0,1])[2]];
const dp=nrm([vw[0],vw[1],0]);
const back=m.P.map(p=>p[0]*dp[0]+p[1]*dp[1]<0);
const runs=[];let st=0;for(let i=1;i<=m.P.length;i++){if(i===m.P.length||back[i]!==back[st]){runs.push([st,Math.min(i,m.P.length-1),back[st]]);st=i;}}
const seg=(a,b,col,w,dash,al)=>{ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.globalAlpha=1;ctx.setLineDash([]);};
const layer=(rs,isBack)=>Rope.drawLayer(ctx,m,rs,{S,vw,s,spin,kap,pulled,back,isBack});
const B=runs.filter(r=>r[2]),F=runs.filter(r=>!r[2]);
layer(B,true);
const a0=S([0,0,-80]),a1=S([0,0,80]),dx=a1[0]-a0[0],dy=a1[1]-a0[1],L=Math.hypot(dx,dy),nx=-dy/L*R0*s,ny=dx/L*R0*s;
ctx.beginPath();ctx.moveTo(a0[0]+nx,a0[1]+ny);ctx.lineTo(a1[0]+nx,a1[1]+ny);ctx.lineTo(a1[0]-nx,a1[1]-ny);ctx.lineTo(a0[0]-nx,a0[1]-ny);ctx.closePath();ctx.fillStyle=C.cf;ctx.fill();
seg([a0[0]+nx,a0[1]+ny],[a1[0]+nx,a1[1]+ny],C.cs,1.2,[],1);seg([a0[0]-nx,a0[1]-ny],[a1[0]-nx,a1[1]-ny],C.cs,1.2,[],1);
seg([a0[0]+nx*0.45,a0[1]+ny*0.45],[a1[0]+nx*0.45,a1[1]+ny*0.45],C.cs,0.8,[],0.5);
layer(F,false);}
requestAnimationFrame(frame);
</script>
</body>
</html>
