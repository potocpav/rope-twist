<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rope twist between two bars</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
canvas{width:100%;display:block;background:#fff;border:1px solid var(--outline);border-radius:8px;}
.stage{position:relative;}
.controls{display:grid;grid-template-columns:auto minmax(0,1fr) 72px;align-items:center;gap:6px 10px;margin:14px 0;}
.controls label{white-space:nowrap;grid-column:1;font-size:14px;color:var(--muted);} /* each label starts a row */
.seg{display:flex;grid-column:2 / -1;} /* across the output column too: bar rows have no output */
.seg button{flex:1;min-width:0;height:30px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px;font-variant-numeric:tabular-nums;cursor:pointer;}
.seg button+button{border-left:0;}
.seg button:first-child{border-radius:8px 0 0 8px;}
.seg button:last-child{border-radius:0 8px 8px 0;}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;}
.controls output{font-size:14px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums;}
/* Pause and reset buttons, overlaid at the bottom centre of the canvas, between the two vertical ropes; the canvas is always white, so fixed light colours. */
.overlay{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:8px;}
.overlay button{width:40px;height:36px;border:1px solid #d6d4cc;border-radius:8px;background:rgba(255,255,255,.85);color:#1f1e1c;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.overlay button:hover{background:#f3f2ee;}
button svg{width:16px;height:16px;fill:currentColor;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line);}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-7px;border:none;}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:none;}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.stat{background:var(--panel);border-radius:8px;padding:12px 14px;}
.stat div:first-child{font-size:13px;color:var(--muted);}
.stat div:last-child{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;}
.note{font-size:12px;line-height:1.5;color:var(--muted);margin:10px 0 0;}
/* Shown only if the model lets the rope slip on a bar, which it never should (see checkNoSlip). */
.slip{font-size:14px;font-weight:500;color:#fff;background:#c0281e;border-radius:8px;padding:10px 14px;margin:12px 0 0;}
</style>
</head>
<body>
<div class="stage">
<canvas id="c" aria-label="Animated 3D rendering: a textured rope runs up from below, bends 90° over a first bar, runs across to a second bar, bends 90° over it and runs back down. Each bar can be set square to the rope, pointing at the viewer, or turned 45° either way. A white grid painted on the rope shows torsion building up between the bars."></canvas>
<div class="overlay">
<button id="pp" aria-label="Pause"></button>
<button id="rs" aria-label="Reset" title="Reset"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7.75.75 0 1 1 1.4.5A4 4 0 1 0 8 4h-.6l1.1 1.1a.75.75 0 0 1-1 1L5.2 3.8a.75.75 0 0 1 0-1.1L7.5.5a.75.75 0 0 1 1 1L7.4 2.5z"/></svg></button>
</div>
</div>
<div class="controls">
<label for="sv">Pull speed</label><input type="range" id="sv" min="-10" max="10" step="0.1" value="5"><output id="so">5.0 cm/s</output>
<label for="rb">Bar radius, <i>R</i></label><input type="range" id="rb" min="0.5" max="2" step="0.01" value="1"><output id="bo">1.0 cm</output>
<label id="b0l">Left bar, <i>α</i></label><div class="seg" role="group" aria-labelledby="b0l" id="b0"><button data-t="-1">−45°</button><button data-t="0">0°</button><button data-t="1">+45°</button></div>
<label id="b1l">Right bar, <i>α</i></label><div class="seg" role="group" aria-labelledby="b1l" id="b1"><button data-t="-1">−45°</button><button data-t="0">0°</button><button data-t="1">+45°</button></div>
</div>
<div class="stats">
<div class="stat"><div>Spin rate, <math><mfrac><mi>ω</mi><mrow><mn>2</mn><mo>&#x2062;</mo><mi>π</mi></mrow></mfrac></math></div><div id="ow">0.00 rev/s</div></div>
<div class="stat"><div>Torsion between the bars, <math><mfrac><msub><mi>ν</mi><mn>3</mn></msub><mrow><mn>2</mn><mo>&#x2062;</mo><mi>π</mi></mrow></mfrac></math></div><div id="ok">0.0 rev/m</div></div>
</div>
<p class="slip" id="slip" role="alert" hidden></p>
<p class="note" id="lg" hidden>This figure needs WebGL 2, which this browser does not provide.</p>
<script src="rope.js"></script>
<script>
// Two bars of radius R (set with the bar radius slider, from 0.5 to 2 cm, for both bars) side by side (x right, y up, z toward the viewer). The rope runs up from below,
// bends 90° over the left bar, runs across to the right, bends 90° over the right bar and runs back down.
// Each bar is set at an angle t·90° (t from -1 to 1, animated between -1, 0 and 1): at 0 its axis points at
// the viewer and the rope wraps a quarter turn square across it (wrap angle α = 0°, measured from a line
// square across the bar); at ±1 its axis lies diagonally in the screen plane and the rope wraps half a
// turn at α = 45° (+1, going behind the bar first) or α = -45° (-1, the mirror image: in front first).
// Braid row spacing D equals the arc width of one strand (rr·STEP): texture pixels are square on the surface.
// The 3D scene always uses the light palette on a white canvas; the controls follow the page theme.
const R0=1,LM45=7; // default bar radius, length of the straight rope between the bars when both are at ±45° with it (cm)
const C=Rope.THEMES.light.c,{rr,NS,add,sub,mul,dot,cross,nrm}=Rope,STEP=2*Math.PI/NS,D=rr*STEP;
const cv=document.getElementById('c'),$=id=>document.getElementById(id);
const gl=cv.getContext('webgl2',{antialias:true,premultipliedAlpha:false});
if(!gl)$('lg').hidden=false;
let W,H,dpr=window.devicePixelRatio||1;
function resize(){W=cv.clientWidth;H=Math.round(W*0.6);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+cv.offsetWidth-W+'px';} // plus the border, so the drawing area stays H tall
resize();addEventListener('resize',resize);

// Geometry. Rh = R + rr: radius of the rope centreline on a bar of radius R. A bar bending the rope from direction din to dout
// has its axis a in the plane of n = din × dout (pointing at the viewer) and m = din + dout (the bend's
// diagonal), a = n cos(t·90°) + m sin(t·90°), so the rope meets it at the same angle α on both sides:
// sin α = a·din = a·dout. The rope's centreline on it is a helix about the axis, p(θ) = c + Rh(cos θ·e1 +
// sin θ·e2) + kθ·a with k = Rh·tan α, from θ = 0, where its tangent is din, to θ = ψ (the angle the rope
// turns through around the bar), where it is dout; e2 is the part of din across the axis, and e1 = e2 × a is the bar's
// outward normal where the rope arrives.
const NI=40,LIN=30; // NI samples and length LIN (cm) of each straight tail
function barGeom(din,dout,t,R){const Rh=R+rr,g=t*Math.PI/2,n=nrm(cross(din,dout)),m=nrm(add(din,dout));
const a=nrm(add(mul(n,Math.cos(g)),mul(m,Math.sin(g)))),sa=dot(a,din),e2=nrm(sub(din,mul(a,sa))),e1=cross(e2,a);
const co=nrm(sub(dout,mul(a,dot(a,dout))));let psi=Math.atan2(dot(a,cross(e2,co)),dot(e2,co));if(psi<=1e-9)psi+=2*Math.PI;
const k=Rh*sa/Math.sqrt(1-sa*sa); // Rh·tan α
return{a,e1,e2,k,psi,sa,R,Rh,p:th=>add(mul(e1,Rh*Math.cos(th)),add(mul(e2,Rh*Math.sin(th)),mul(a,k*th))),
tg:th=>nrm(add(mul(e1,-Rh*Math.sin(th)),add(mul(e2,Rh*Math.cos(th)),mul(a,k))))};}
// The whole path for bar angles t1, t2. The bars are placed so that the rope runs up along x = -XT into
// the left bar, straight across along the x axis, and down along x = XT out of the right bar, whatever
// the angles and radii: the rope between the bars is LM45 long with both bars at ±45° and of radius R0,
// and longer at other angles, where a bar moves the rope less far sideways (shorter for larger bars). So does its texture: the zero-twist frame is turned to be the same there
// whatever the angles, and arc length s is counted from a fixed value there.
const XT=LM45/2+(()=>{const b=barGeom([0,1,0],[1,0,0],1,R0);return b.p(b.psi)[0]-b.p(0)[0];})();
function buildPath(t1,t2,r1,r2){const P=[],Tg=[],K=[],seg=(p,t)=>{P.push(p);Tg.push(t);};
const b1=barGeom([0,1,0],[1,0,0],t1,r1),b2=barGeom([1,0,0],[0,-1,0],t2,r2);
const p1=b1.p(b1.psi),q2=b2.p(0),q2e=b2.p(b2.psi);
b1.c=[-XT-b1.p(0)[0],-p1[1],-p1[2]];b2.c=[XT-q2e[0],-q2[1],-q2[2]];
const x1=add(b1.c,p1),LM=add(b2.c,q2)[0]-x1[0];
const helix=b=>{const n=Math.max(30,Math.round(b.psi*60));for(let i=0;i<=n;i++){const th=b.psi*i/n;seg(add(b.c,b.p(th)),b.tg(th));}};
const e1=add(b1.c,b1.p(0));for(let i=NI;i>0;i--)seg(add(e1,[0,-LIN*i/NI,0]),[0,1,0]);
K.push(P.length);helix(b1);K.push(P.length-1);
for(let i=1,n=30;i<n;i++)seg(add(x1,[LM*i/n,0,0]),[1,0,0]);
K.push(P.length);helix(b2);K.push(P.length-1);
const x2=P[P.length-1];for(let i=1;i<=NI;i++)seg(add(x2,[0,-LIN*i/NI,0]),[0,-1,0]);
const r=Rope.rmf(P,Tg,[1,0,0]),U=r.U,iB=K[1],ref=[0,0,1];
const dl=Math.atan2(dot(cross(U[iB],ref),Tg[iB]),dot(U[iB],ref)),cd=Math.cos(dl),sd=Math.sin(dl);
for(let i=0;i<U.length;i++)U[i]=add(mul(U[i],cd),mul(cross(Tg[i],U[i]),sd)); // turned about each tangent
const S=r.S.map(x=>x-r.S[iB]+100);
// Rate (rad/cm) at which the zero-twist frame turns relative to a bar's outward normal, over the
// samples i0..i1 in contact with the bar: the spin the bar forces, as in Figure 4.
const tw=(i0,i1,b)=>{let psi=0,prev=null;for(let i=i0;i<=i1;i++){const d=sub(P[i],b.c),h=nrm(sub(d,mul(b.a,dot(d,b.a)))),u=U[i],bn=cross(Tg[i],u),ang=Math.atan2(dot(h,bn),dot(h,u));
if(prev!==null){let x=ang-prev;psi+=Math.atan2(Math.sin(x),Math.cos(x));}prev=ang;}return psi/(S[i1]-S[i0]);};
return{P,Tg,U,S,LM,ks:K.map(i=>S[i]),tau:[tw(K[0],K[1],b1),tw(K[2],K[3],b2)],bars:[b1,b2],};}
let geo,sA,sB,sC,sD,L1,L2,LM,TAU1,TAU2;

// Shaders, as in Figure 4, except that the rope's spin varies along it. Rope vertices carry (s, a): arc
// length along the centreline and angle around it in the zero-twist frame. The material angle is
// a - spin(s). Its slope, the twist, is given at the four ends of the twisted stretch uKs (uKk) and is linear in
// between, so spin(s) runs from its value uKp at the start of each stretch as a quadratic over a contact,
// linearly between the bars, and stays constant along the two tails. The material position along the rope is s - pulled.
// The bars use their own local frame (uBarX, uBarY, and the axis uBarZ, from origin uBarO) for the
// contact shadow under the rope.
const VS=`#version 300 es
in vec3 aPos;in vec3 aNrm;in vec2 aSA;
uniform mat4 uMVP;
out vec3 vN,vV,vW;out vec2 vSA;
void main(){gl_Position=uMVP*vec4(aPos,1.);vN=aNrm;vV=aPos;vW=aPos;vSA=aSA;}`;
const FS=`#version 300 es
precision highp float;
in vec3 vN,vV,vW;in vec2 vSA;
uniform int uMode; // 0 textured rope, 1 plain shaded (bar)
uniform vec3 uColor,uLight,uFill;uniform sampler2D uTex,uNormal,uAO;uniform vec2 uTexScale,uMapScale;
uniform float uPulled,uD,uStep,uRr,uGridL;
uniform vec2 uR0; // bar radii
uniform vec4 uKs,uKp,uKk; // spin knots: arc lengths, spin angles, twists
uniform vec3 uAxO[2],uAxA[2]; // bar axes (point, direction), for the rope's contact shading
uniform vec3 uBarO,uBarX,uBarY,uBarZ; // this bar's local frame
uniform vec4 uHelix; // contact centreline in it: radius, z per radian, start angle, z at start
uniform vec2 uArc;   // its direction of travel (±1), angular span
const float PI=3.14159265359,GRID_N=6.,GRID_W=.02; // grid: lines around the rope, line half-width (cm)
out vec4 o;
float gridLine(float x,float period){
  float d=abs(fract(x/period+.5)-.5)*period,aa=fwidth(x)*.75;
  return 1.-smoothstep(GRID_W-aa,GRID_W+aa,d);
}
// Spin over a stretch from s0 to s1 starting at p0, with the twist changing linearly from k0 to k1.
float seg(float s,float s0,float s1,float p0,float k0,float k1){float x=clamp(s-s0,0.,s1-s0);return p0+x*(k0+.5*(k1-k0)*x/max(s1-s0,1e-4));}
float spinAt(float s){return s<uKs.x?uKp.x:s<uKs.y?seg(s,uKs.x,uKs.y,uKp.x,uKk.x,uKk.y):s<uKs.z?seg(s,uKs.y,uKs.z,uKp.y,uKk.y,uKk.z):s<uKs.w?seg(s,uKs.z,uKs.w,uKp.z,uKk.z,uKk.w):uKp.w;}
vec3 lin(vec3 c){return pow(c,vec3(2.2));}
// Distance from bar-local point l, at angle t around the bar from the start of the contact, to the rope's
// centreline. Unrolled onto the cylinder of radius uHelix.x, the helix is a straight line, and so,
// nearly, are the straight ropes leading on and off it: distance across that line, combined with the
// height above the line. The lead ropes leave the surface along their tangents, rising to radius
// sqrt(R² + (d cos α)²) at distance d past the contact's end.
float ropeDist(vec3 l,float t){
  vec2 dir=normalize(uHelix.xy),p=vec2(uHelix.x*t,l.z-uHelix.w);
  float along=dot(p,dir),across=dot(p,vec2(-dir.y,dir.x)),len=uArc.y*length(uHelix.xy);
  float over=max(max(-along,along-len),0.)*dir.x,r=sqrt(uHelix.x*uHelix.x+over*over);
  return length(vec2(across,length(l.xy)-r));
}
vec3 perturb(vec3 N,vec3 m,vec2 st){
  vec3 dp1=dFdx(vV),dp2=dFdy(vV);vec2 d1=dFdx(st),d2=dFdy(st);
  vec3 p2=cross(dp2,N),p1=cross(N,dp1),T=p2*d1.x+p1*d2.x,B=p2*d1.y+p1*d2.y;
  float k=inversesqrt(max(max(dot(T,T),dot(B,B)),1e-20));
  return normalize(T*k*m.x+B*k*m.y+N*m.z);
}
void main(){
  vec3 N=normalize(vN),n=N,alb;
  float ao=1.,spec,shine,grid=0.;
  if(uMode==0){
    float phi=vSA.y-spinAt(vSA.x),q=phi/uStep,p=(vSA.x-uPulled)/uD;
    vec2 uv=uTexScale*vec2(q-p,q+p),st=uv*uMapScale;
    alb=lin(texture(uTex,uv).rgb);
    n=perturb(N,texture(uNormal,st).xyz*2.-1.,st);
    ao=texture(uAO,st).r;
    // Contact with a bar: the rope's underside, close to the bar's surface, sees little light.
    float r=1e9;for(int k=0;k<2;k++)r=min(r,length(cross(vW-uAxO[k],uAxA[k]))-uR0[k]);
    ao*=mix(.35,1.,smoothstep(0.,1.2*uRr,r));
    spec=.06;shine=12.;
    grid=max(gridLine(phi*uRr,2.*PI*uRr/GRID_N),gridLine(vSA.x-uPulled,uGridL));
  }else{
    alb=lin(uColor);
    // Contact shadow under the rope. The angle around the bar is measured from the start of the contact,
    // both ways round (t and t - 2π), and the nearer of the two rope positions counts, so the shadow is
    // continuous all round the bar.
    vec3 d=vW-uBarO,l=vec3(dot(d,uBarX),dot(d,uBarY),dot(d,uBarZ));
    float t=mod(uArc.x*(atan(l.y,l.x)-uHelix.z),2.*PI);
    float dist=min(ropeDist(l,t),ropeDist(l,t-2.*PI));
    ao=mix(.3,1.,smoothstep(uRr,3.5*uRr,dist));
    spec=.25;shine=40.;
  }
  vec3 V=vec3(0,0,1),Hk=normalize(uLight+V);
  float key=max(dot(n,uLight),0.),fill=max(dot(n,uFill),0.);
  vec3 amb=mix(vec3(.16,.15,.14),vec3(.34,.35,.37),.5+.5*n.y); // ground below, sky above
  vec3 c=alb*(amb*ao+(.95*key+.18*fill)*mix(1.,ao,.6));
  c+=spec*pow(max(dot(n,Hk),0.),shine)*ao*key*vec3(1);
  c=mix(c,vec3(.95)*(.5+.5*max(dot(N,uLight),0.))*mix(1.,ao,.5),.9*grid);
  c+=alb*.12*pow(1.-max(dot(n,V),0.),3.)*ao; // fibre fuzz catching light at grazing angles
  o=vec4(pow(clamp(c,0.,1.),vec3(1./2.2)),1.);
}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
let prog,U={};
if(gl){prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,VS));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
for(const n of['uMVP','uMode','uColor','uLight','uFill','uTex','uTexScale','uNormal','uAO','uMapScale','uPulled','uD','uStep','uR0','uRr','uGridL','uKs','uKp','uKk','uAxO','uAxA','uBarO','uBarX','uBarY','uBarZ','uHelix','uArc'])U[n]=gl.getUniformLocation(prog,n);}

// Rope textures, as in Figure 4 (see rope-twist.html).
const STRUCT=4,GRID_L=NS*D/3;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const barColor=()=>'#'+hex(C.cs).map(v=>Math.round((v+255)/2).toString(16).padStart(2,'0')).join('');
let tex=null,texScale=[1/NS,1/NS],normal=null,occl=null,mapScale=[1,1];
function loadTexture(url,smooth,fallback,onload){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(fallback));
const set=min=>{for(const[p,v]of[[gl.TEXTURE_MIN_FILTER,min],[gl.TEXTURE_MAG_FILTER,smooth?gl.LINEAR:gl.NEAREST],[gl.TEXTURE_WRAP_S,gl.REPEAT],[gl.TEXTURE_WRAP_T,gl.REPEAT]])gl.texParameteri(gl.TEXTURE_2D,p,v);};
set(smooth?gl.LINEAR:gl.NEAREST);
const img=new Image();img.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
if(smooth){gl.generateMipmap(gl.TEXTURE_2D);set(gl.LINEAR_MIPMAP_LINEAR);}onload(img);};img.src=url;return t;}
if(gl){
gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE);
tex=loadTexture('rope-texture.png',false,[...hex(C.ro),255],img=>{const w=img.naturalWidth,h=img.naturalHeight;texScale=[h/(NS*w),1/NS];mapScale=[w/STRUCT,h/STRUCT];});
normal=loadTexture('rope-normal.png',true,[128,128,255,255],()=>{});
occl=loadTexture('rope-ao.png',true,[255,255,255,255],()=>{});}

// Mesh from rings of vertices, as in Figure 4.
const M_ROPE=24,M_BAR=120; // segments around the rope and around a bar
function mesh(rings,M=M_ROPE){const n=rings.length,pos=[],nrmv=[],sa=[],tri=[];
rings.forEach(({c,t,u,r,nc,nt,s})=>{const b=cross(t,u);for(let j=0;j<=M;j++){const a=2*Math.PI*j/M,ca=Math.cos(a),sn=Math.sin(a);
for(let k=0;k<3;k++){const rad=u[k]*ca+b[k]*sn;pos.push(c[k]+r*rad);nrmv.push(rad*nc+t[k]*nt);}sa.push(s,a);}});
for(let i=0;i<n-1;i++)for(let j=0;j<M;j++){const v=i*(M+1)+j,w=v+M+1;tri.push(v,w,v+1,v+1,w,w+1);}
const vao=gl.createVertexArray();gl.bindVertexArray(vao);
const bufs=[];[[pos,3,'aPos'],[nrmv,3,'aNrm'],[sa,2,'aSA']].forEach(([d,k,name])=>{const buf=gl.createBuffer(),loc=gl.getAttribLocation(prog,name);
bufs.push(buf);gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(d),gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,k,gl.FLOAT,false,0,0);});
const ib=gl.createBuffer();bufs.push(ib);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(tri),gl.STATIC_DRAW);
gl.bindVertexArray(null);return{vao,ib,count:tri.length,free(){gl.deleteVertexArray(vao);bufs.forEach(b=>gl.deleteBuffer(b));}};}
const RING=0.25;
function ropeMesh(m){const N=m.P.length,rings=[],idx=[0];
for(let i=1;i<N;i++)if(m.S[i]-m.S[idx[idx.length-1]]>=RING*0.999||i===N-1)idx.push(i);
const cap=(i,sign,r)=>({c:m.P[i],t:m.Tg[i],u:m.U[i],r,nc:0,nt:sign,s:m.S[i]});
rings.push(cap(0,-1,0),cap(0,-1,rr));
for(const i of idx)rings.push({c:m.P[i],t:m.Tg[i],u:m.U[i],r:rr,nc:1,nt:0,s:m.S[i]});
rings.push(cap(N-1,1,rr),cap(N-1,1,0));
return mesh(rings);}
// Bar: cylinder through c along axis t (u at right angles to it), from k0 to k1 along the axis, with
// flat ends and small bevelled edges. Each bar is BAR long, centred on the rope's contact, so a bar
// pointing at the viewer shows only its end face, and a diagonal one shows both ends.
const BEV=0.12,c45=Math.SQRT1_2,b45=BEV*(1-c45),BAR=7.6;
function barMesh(c,t,u,k0,k1,R){const ring=(k,r,nc,nt)=>({c:add(c,mul(t,k)),t,u,r,nc,nt,s:0}),rings=[];
rings.push(ring(k0,0,0,-1),ring(k0,R-BEV,0,-1),ring(k0+b45,R-b45,c45,-c45));
const n=Math.ceil((k1-k0)/0.5);for(let i=0;i<=n;i++)rings.push(ring(k0+BEV+(k1-k0-2*BEV)*i/n,R,1,0));
rings.push(ring(k1-b45,R-b45,c45,c45),ring(k1,R-BEV,0,1),ring(k1,0,0,1));
return mesh(rings,M_BAR);}
// Rebuild the path and meshes for bar angles t1, t2 and radii r1, r2. Each bar's local frame and contact centreline, for
// the shader: [origin, x, y, axis], uHelix, uArc.
let rope=null,BARS=[];
function setBars(t1,t2,r1,r2){geo=buildPath(t1,t2,r1,r2);[sA,sB,sC,sD]=geo.ks;L1=sB-sA;L2=sD-sC;LM=sC-sB;[TAU1,TAU2]=geo.tau;
if(!gl)return;rope&&rope.free();BARS.forEach(b=>b.mesh.free());rope=ropeMesh(geo);
BARS=geo.bars.map(b=>({frame:[b.c,b.e1,b.e2,b.a],helix:[b.Rh,b.k,0,0],arc:[1,b.psi],mesh:barMesh(b.c,b.a,b.e1,b.k*b.psi/2-BAR/2,b.k*b.psi/2+BAR/2,b.R)}));}

// Spin of the rope: its angle in the zero-twist frame, and its twist (slope of the angle) km between the
// bars. The free rope carries the same torque all along, so it is twisted uniformly: km between the bars,
// and none along the two free tails, which turn rigidly with the contacts they meet.
// A bent rope resists turning about its own axis, so the rope on a bar keeps its angle to its bend
// (towards the bar's axis) where it arrives, and turns at v(τ - k), where τ is the spin the bar forces and
// k is the twist of the arriving rope (as in Figure 4, where k = 0). The rope never slips on a bar. As a
// simple model, the twist dissipates linearly around each bar: from km at the side facing the other bar
// down to none where the rope leaves for its tail.
// Running left to right, the incoming rope is untwisted, so the left bar turns it at its own τ (none, when
// square to the rope); the right bar turns its rope too, which twists the rope between the bars, until
// that twist makes up the difference between the two bars' τ and the whole rope turns at the left bar's
// rate.
// State: pA, the angle of the left tail, and km.
let pA=0,km=0;
// Angles at the four ends of the twisted stretch: where the rope meets the left bar from its tail, the two
// ends of the rope between the bars, and where it leaves the right bar for its tail; and those points' arc
// lengths.
const spins=()=>{const pB=pA+km*L1/2,pC=pB+km*LM;return[pA,pB,pC,pC+km*L2/2];};
const knots=()=>[sA,sB,sC,sD];
// Stuck rates of the upstream (u) and downstream (d) contact entries: the left tail and the left end of the
// rope between the bars when running left to right, the right tail and the right end of it when running
// right to left. Their angles are spins()[iu] and spins()[id].
const stuck=v=>{const fw=v>=0;return{wu:fw?v*TAU1:v*TAU2,wd:fw?v*(TAU2-km):v*(TAU1-km),iu:fw?0:3,id:fw?2:1};};
function stepSpin(v,dt){const{wu,wd}=stuck(v),fw=v>=0;
// The angle difference between the two entries changes with km over the rope between the bars and the
// upstream bar's half of its linear ramp: X·km. Both entries turn at their stuck rates.
const X=LM+(fw?L1:L2)/2,pd=spins()[fw?2:1]+wd*dt;
km+=(fw?wd-wu:wu-wd)/X*dt;
if(fw)pA+=wu*dt;else pA=pd-km*L1/2;}
// No-slip check: over every step, each bar's contact entry must have turned at exactly its stuck rate.
// Anything else is the rope slipping on a bar, which this figure must never show, so it is reported
// loudly, in the figure and on the console, rather than drawn quietly.
let slipped=false;
function checkNoSlip(v,dt,before,after,s){const{wu,wd,iu,id}=s;
for(const[i,w]of[[iu,wu],[id,wd]]){const err=after[i]-before[i]-w*dt;
if(Math.abs(err)>1e-6*(1+Math.abs(w*dt))&&!slipped){slipped=true;
const msg='Model error: the rope slips on the '+(i<2?'left':'right')+' bar ('+err.toExponential(2)+' rad in one step).';
console.error(msg);$('slip').textContent=msg;$('slip').hidden=false;}}}

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let pulled=0,last=performance.now();
const sv=$('sv'),pp=$('pp'),rb=$('rb'),radii=()=>[+rb.value,+rb.value]; // one radius for both bars
const ICON_PAUSE='<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a.8.8 0 0 0 1.2.7l9-5.5a.8.8 0 0 0 0-1.4l-9-5.5A.8.8 0 0 0 4 2.5z"/></svg>';
// Play/pause follows the pull speed, as in Figure 4: paused exactly when the speed is 0.
const DEFAULT_SPEED=+sv.defaultValue;let resume=DEFAULT_SPEED;
const playing=()=>+sv.value!==0;
if(reduce)sv.value=0;
function setBtn(){pp.innerHTML=playing()?ICON_PAUSE:ICON_PLAY;pp.setAttribute('aria-label',playing()?'Pause':'Play');}
pp.onclick=()=>{if(playing()){resume=+sv.value;sv.value=0;}else{sv.value=resume;resume=DEFAULT_SPEED;}setBtn();};
sv.addEventListener('input',()=>{if(!playing())resume=DEFAULT_SPEED;setBtn();});
// Bar angles: each bar eases from its current angle to the chosen one over TURN seconds.
const TURN=0.8,DEFAULT_T=[1,-1],bars=DEFAULT_T.map(t=>({t,from:t,to:t,t0:0}));
const ease=x=>x*x*(3-2*x);
function setTarget(i,to){const b=bars[i];b.from=b.t;b.to=to;b.t0=performance.now();if(reduce)b.from=to;
$('b'+i).querySelectorAll('button').forEach(e=>e.setAttribute('aria-pressed',+e.dataset.t===to));}
[0,1].forEach(i=>$('b'+i).querySelectorAll('button').forEach(e=>e.onclick=()=>setTarget(i,+e.dataset.t)));
// Reset: the speed, bar angles and radius back to their defaults, the rope untwisted, and play.
$('rs').onclick=()=>{sv.value=sv.defaultValue;rb.value=rb.defaultValue;resume=DEFAULT_SPEED;pA=km=0;DEFAULT_T.forEach((t,i)=>setTarget(i,t));setBtn();pp.focus();};
setBtn();DEFAULT_T.forEach((t,i)=>setTarget(i,t));let geoR=radii();setBars(...DEFAULT_T,...geoR);
// Signs: positive spin is the direction a bar at +45° turns the rope when it is pulled left to right.
const SG=Math.sign(buildPath(0,1,R0,R0).tau[1])||1,fmt=(x,d)=>(Math.abs(x)<0.5*10**-d?0:x).toFixed(d).replace('-','−');
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const v=+sv.value;
let moved=false;for(const b of bars){const t=b.from+(b.to-b.from)*ease(Math.min(1,Math.max(0,(now-b.t0)/1000/TURN)));if(t!==b.t){b.t=t;moved=true;}}
const rs=radii();if(rs.some((r,i)=>r!==geoR[i])){geoR=rs;moved=true;}
if(moved)setBars(bars[0].t,bars[1].t,...geoR);
$('bo').textContent=geoR[0].toFixed(1)+' cm';
for(let i=0;i<4;i++){const s=stuck(v),before=spins();stepSpin(v,dt/4);checkNoSlip(v,dt/4,before,spins(),s);}
pulled=(pulled+v*dt)%(NS*D);
pA-=2*Math.PI*Math.floor(pA/(2*Math.PI)); // keep the angles small
$('so').textContent=fmt(v,1)+' cm/s';
// Spin rate (revolutions per second) of the incoming rope: the upstream tail, which turns with the first
// bar it meets at that bar's stuck rate, so it settles at once rather than with the torsion.
$('ow').textContent=fmt(SG*stuck(v).wu/(2*Math.PI),2)+' rev/s';
$('ok').textContent=fmt(SG*km*100/(2*Math.PI),1)+' rev/m';
if(gl)draw();requestAnimationFrame(frame);}

// Orthographic front view, VIEW cm wide and fixed, framing both bars at any angle with the rope's tails
// running off the bottom.
const VIEW=18,MX=0,TOP=2.4; // fits every bar angle: x from -9 to 9, top at y = TOP
function draw(){gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
const s=W/VIEW,kx=2*s/W,ky=2*s/H,kz=1/100,my=TOP-H/(2*s);
gl.useProgram(prog);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);
gl.uniformMatrix4fv(U.uMVP,false,new Float32Array([kx,0,0,0,0,ky,0,0,0,0,-kz,0,-kx*MX,-ky*my,0,1]));
const unit=v=>{const l=Math.hypot(...v);return v.map(x=>x/l);};
gl.uniform3fv(U.uLight,unit([-0.35,0.55,1]));gl.uniform3fv(U.uFill,unit([0.6,-0.3,0.5]));
gl.uniform1f(U.uPulled,pulled);gl.uniform1f(U.uD,D);gl.uniform1f(U.uStep,STEP);gl.uniform1f(U.uGridL,GRID_L);
gl.uniform2fv(U.uR0,geo.bars.map(b=>b.R));gl.uniform1f(U.uRr,rr);
gl.uniform4fv(U.uKs,knots());gl.uniform4fv(U.uKp,spins());gl.uniform4fv(U.uKk,[0,km,km,0]);
gl.uniform3fv(U.uAxO,geo.bars.flatMap(b=>b.c));gl.uniform3fv(U.uAxA,geo.bars.flatMap(b=>b.a));
gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(U.uTex,0);gl.uniform2fv(U.uTexScale,texScale);
gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,normal);gl.uniform1i(U.uNormal,1);
gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,occl);gl.uniform1i(U.uAO,2);gl.uniform2fv(U.uMapScale,mapScale);
const drawObj=o=>{gl.bindVertexArray(o.vao);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,o.ib);gl.drawElements(gl.TRIANGLES,o.count,gl.UNSIGNED_INT,0);};
gl.uniform1i(U.uMode,1);gl.uniform3fv(U.uColor,hex(barColor()).map(x=>x/255));
for(const b of BARS){const[o,x,y,z]=b.frame;gl.uniform3fv(U.uBarO,o);gl.uniform3fv(U.uBarX,x);gl.uniform3fv(U.uBarY,y);gl.uniform3fv(U.uBarZ,z);
gl.uniform4fv(U.uHelix,b.helix);gl.uniform2fv(U.uArc,b.arc);drawObj(b.mesh);}
gl.uniform1i(U.uMode,0);gl.uniform3fv(U.uColor,hex(C.ro).map(x=>x/255));drawObj(rope);
gl.bindVertexArray(null);}
requestAnimationFrame(frame);
</script>
</body>
</html>
